# Sanitized from a real Hyprland configuration.
monitor = , preferred, auto, 1

input {
    kb_layout = us
    numlock_by_default = true
    touchpad {
        disable_while_typing = true
        scroll_factor = 0.5
    }
}

general {
    gaps_in = 4
    gaps_out = 5
    col.active_border = rgba(1122E1D1)
    col.inactive_border = rgba(31313600)
    layout = dwindle
}

gestures {
    gesture = 3, horizontal, workspace
}

$mainMod = SUPER
bind = $mainMod, Return, exec, kitty
